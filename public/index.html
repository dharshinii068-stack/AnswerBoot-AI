<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnswerBot - AI FAQ Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .chat-area {
            height: 450px;
            overflow-y: auto;
            padding: 25px;
            background: #f8f9ff;
        }

        .welcome {
            text-align: center;
            padding: 50px 20px;
            color: #555;
        }

        .bot-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .welcome h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .message {
            margin-bottom: 18px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
        }

        .user .bubble {
            background: #4f46e5;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: white;
            color: #333;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
        }

        #question:focus {
            border-color: #4f46e5;
        }

        #askButton {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 0 25px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #askButton:hover {
            background: #3730a3;
        }

        #askButton:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .status {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            color: #777;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 25px;
            }

            .chat-area {
                height: 400px;
            }

            .input-box {
                flex-direction: column;
            }

            #askButton {
                height: 48px;
            }

            .bubble {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🤖 AnswerBot</h1>
        <p>AI-Powered FAQ & Customer Support Assistant</p>
    </div>

    <div class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">
            <div class="bot-icon">🤖</div>
            <h2>Welcome to AnswerBot!</h2>
            <p>Ask me a question and I will try to help you.</p>
        </div>

    </div>

    <div class="input-area">

        <div class="input-box">

            <input
                type="text"
                id="question"
                placeholder="Type your question..."
                autocomplete="off"
            >

            <button id="askButton">
                Ask 🤖
            </button>

        </div>

        <div class="status" id="status">
            AnswerBot is ready
        </div>

    </div>

</div>


<script>

    const questionInput = document.getElementById("question");
    const askButton = document.getElementById("askButton");
    const chatArea = document.getElementById("chatArea");
    const status = document.getElementById("status");
    const welcome = document.getElementById("welcome");


    function addMessage(text, type) {

        if (welcome) {
            welcome.remove();
        }

        const message = document.createElement("div");

        message.className = `message ${type}`;

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = text;

        message.appendChild(bubble);

        chatArea.appendChild(message);

        chatArea.scrollTop = chatArea.scrollHeight;
    }


    async function askQuestion() {

        const question = questionInput.value.trim();

        if (!question) {
            alert("Please enter a question.");
            return;
        }

        addMessage(question, "user");

        questionInput.value = "";

        askButton.disabled = true;

        status.textContent = "AnswerBot is thinking... 🤔";


        try {

            const response = await fetch("/api/ai/ask", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message || "Something went wrong"
                );

            }


            addMessage(data.answer, "bot");

            status.textContent = "AnswerBot is ready";


        } catch (error) {

            console.error(error);

            addMessage(
                "Sorry, I could not process your question right now.",
                "bot"
            );

            status.textContent = "Connection error";

        }


        askButton.disabled = false;

        questionInput.focus();
    }


    askButton.addEventListener("click", askQuestion);


    questionInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            askQuestion();
        }

    });

</script>

</body>
</html>
