<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>AnswerBot - Register</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
        text-align: center;
        font-size: 45px;
        margin-bottom: 10px;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        color: #333;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 14px;
        margin-bottom: 18px;
        border: 2px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #4f46e5;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #3730a3;
    }

    #message {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
    }

    .login-link {
        text-align: center;
        margin-top: 20px;
        color: #666;
    }

    .login-link a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: bold;
    }
</style>


</head>

<body>

<div class="container">


<div class="logo">🤖</div>

<h1>Create Account</h1>

<p class="subtitle">
    Register for AnswerBot
</p>

<form id="registerForm">

    <label for="name">Name</label>

    <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
    >

    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
    >

    <button type="submit">
        Register
    </button>

</form>

<div id="message"></div>

<div class="login-link">
    Already have an account?
    <a href="/login.html">Login</a>
</div>


</div>

<script>

    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");

    registerForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.textContent = "Registering...";

        try {

            const response = await fetch("/api/auth/register", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })

            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Registration failed");
            }

            message.textContent = "Registration successful!";

            registerForm.reset();

            setTimeout(function() {
                window.location.href = "/login.html";
            }, 1000);

        } catch (error) {

            console.error(error);

            message.textContent = error.message;

        }

    });

</script>

</body>
</html>
